name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and skill
        run: python3 scripts/validate_skill.py
      - name: Test optional desktop analysis contract (offline)
        run: python3 -B -m unittest discover -s tests -v
