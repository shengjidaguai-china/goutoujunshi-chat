name: Platform preview packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional preview release tag, for example v0.1.0-preview"
        required: false
        type: string
  push:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"
  pull_request:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/jev_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-jev-chat-android-debug
          path: integrations/jev_android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: integrations/jev_windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q app core main.py
      - run: python -m core.draft
      - run: pyinstaller --noconfirm --clean jev.spec
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist/goutoujunshi-jev-chat-windows/README.md
          Copy-Item LICENSE dist/goutoujunshi-jev-chat-windows/LICENSE
          Copy-Item NOTICE dist/goutoujunshi-jev-chat-windows/NOTICE
          Compress-Archive -Path dist/goutoujunshi-jev-chat-windows -DestinationPath dist/goutoujunshi-jev-chat-windows-preview.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-jev-chat-windows-preview
          path: integrations/jev_windows/dist/goutoujunshi-jev-chat-windows-preview.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B scripts/validate_skill.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/package_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-jev-chat-mac-source
          path: dist/goutoujunshi-jev-chat-mac.zip

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [android, windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Verify and name release files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]
          mkdir -p publish
          cp release-assets/goutoujunshi-jev-chat-mac-source/goutoujunshi-jev-chat-mac.zip publish/
          cp release-assets/goutoujunshi-jev-chat-android-debug/app-debug.apk publish/goutoujunshi-jev-chat-android-debug.apk
          cp release-assets/goutoujunshi-jev-chat-windows-preview/goutoujunshi-jev-chat-windows-preview.zip publish/
          test -s publish/goutoujunshi-jev-chat-mac.zip
          test -s publish/goutoujunshi-jev-chat-android-debug.apk
          test -s publish/goutoujunshi-jev-chat-windows-preview.zip
          (cd publish && sha256sum *.zip *.apk > SHA256SUMS.txt)
      - name: Publish preview release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## 三端预览包 / Preview packages

          - **macOS:** `goutoujunshi-jev-chat-mac.zip` — source package. Install Python 3.12 and uv, then run `安装依赖.command` and `启动.command`. This is not a signed `.app`.
          - **Android:** `goutoujunshi-jev-chat-android-debug.apk` — debug build. Automated build and unit tests pass; physical-device validation is pending.
          - **Windows:** `goutoujunshi-jev-chat-windows-preview.zip` — extract the complete directory before launching the executable. Automated build passes; physical-device validation is pending.

          The Mac screenshots and full relationship features in the README do not yet apply to Android or Windows. Check `SHA256SUMS.txt` after downloading. See the README and PRIVACY.md for setup, feature scope, and data use.

          Windows packages include PySide6-Fluent-Widgets; see `integrations/jev_windows/NOTICE` for redistribution terms.
          EOF
          gh release create "$RELEASE_TAG" publish/* --target "$GITHUB_SHA" --latest --title "狗头军师 Jev Chat $RELEASE_TAG" --notes-file release-notes.md
