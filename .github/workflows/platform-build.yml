name: Platform preview packages

on:
  workflow_dispatch:
  push:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"
  pull_request:
    paths:
      - "integrations/jev_android/**"
      - "integrations/jev_windows/**"
      - "integrations/jev_mac/**"
      - "scripts/package_mac.py"
      - "PRIVACY.md"
      - "tests/test_platform_integrations.py"
      - ".github/workflows/platform-build.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/jev_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-chat-android-debug
          path: integrations/jev_android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: integrations/jev_windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m compileall -q app core main.py
      - run: python -m core.draft
      - run: pyinstaller --noconfirm --clean jev.spec
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist/goutoujunshi-chat-windows/README.md
          Copy-Item LICENSE dist/goutoujunshi-chat-windows/LICENSE
          Copy-Item NOTICE dist/goutoujunshi-chat-windows/NOTICE
          Compress-Archive -Path dist/goutoujunshi-chat-windows -DestinationPath dist/goutoujunshi-chat-windows-preview.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-chat-windows-preview
          path: integrations/jev_windows/dist/goutoujunshi-chat-windows-preview.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B scripts/validate_skill.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/package_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-chat-mac-source
          path: dist/goutoujunshi-chat-mac.zip
